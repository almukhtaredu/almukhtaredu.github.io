<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Almukhtar Edu | 2026-2027</title>
    <style>
        :root { --primary: #7d3f98; --secondary: #007bff; --accent: #ffc107; --bg: #050505; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
        }

        body { 
            background-color: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; 
            margin: 0; min-height: 100vh; min-height: 100dvh; width: 100%;
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 20px;
            overflow: hidden; position: fixed; inset: 0;
            padding: 20px;
        }

        #matrix-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; }
        .content {
            z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 20px;
            background: rgba(0,0,0,0.7); padding: 30px; border-radius: 20px;
            width: 100%; max-width: 480px;
        }
        
        .year-header { font-size: 5rem; font-weight: 900; color: var(--primary); direction: ltr; margin: 0; }
        .year-header .changing { color: var(--secondary); } 
        
        .logo { width: 250px; max-width: 60vw; height: auto; }
        .subjects { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .sub-tag { padding: 8px 20px; border: 1px solid #444; border-radius: 20px; font-size: 1rem; color: #fff; white-space: nowrap; }
        .programming-tag { border-color: var(--primary) !important; }
        
        /* تصميم زر الحجز */
        .btn-booking { 
            padding: 15px 40px; background: transparent; color: var(--secondary); 
            border: 2px solid var(--secondary); border-radius: 30px; font-size: 1.2rem; 
            font-weight: bold; cursor: pointer; text-decoration: none; transition: 0.3s;
            width: 100%; text-align: center;
        }
        .btn-booking:hover { background: var(--secondary); color: #fff; box-shadow: 0 0 15px var(--secondary); }

        footer { position: fixed; bottom: 10px; left: 0; right: 0; z-index: 1; font-size: 0.75rem; color: #555; text-align: center; padding: 0 10px; }

        @media (max-width: 480px) {
            .year-header { font-size: 3.2rem; }
            .content { padding: 22px; gap: 14px; }
            .logo { width: 170px; }
            .sub-tag { font-size: 0.85rem; padding: 6px 14px; }
            .btn-booking { font-size: 1rem; padding: 13px 30px; }
        }

        @media (max-height: 600px) {
            .year-header { font-size: 2.6rem; }
            .logo { width: 130px; }
            .content { gap: 10px; padding: 16px; }
        }
    </style>
</head>
<body>

    <canvas id="matrix-bg"></canvas>

    <div class="content">
        <div class="year-header">20<span class="changing" id="year-change">26</span></div>
        <img src="logo.png" alt="Logo" class="logo">
        <div class="subjects">
            <div class="sub-tag" style="border-color: var(--primary);">ICT</div>
            <div class="sub-tag" style="border-color: var(--secondary);">Math</div>
            <div class="sub-tag programming-tag">Programming & AI</div>
        </div>
        
        <!-- زر الحجز -->
        <a href="booking.html" class="btn-booking">احجز مكانك الآن</a>
    </div>

    <footer>جميع الحقوق محفوظة © 2027 - مهندس محمد مختار</footer>

    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        const mathSymbols = "π∑∫√ΔΩλμ"; 
        const techSymbols = "<>{}[]+-*/=01"; 
        const fontSize = 32;
        let columns, drops;

        function setupCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            drops = Array(Math.floor(columns)).fill(1);
        }
        setupCanvas();
        window.addEventListener('resize', setupCanvas);
        window.addEventListener('orientationchange', setupCanvas);

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'bold ' + fontSize + 'px Arial';
            drops.forEach((y, i) => {
                let text, color;
                if (Math.random() > 0.5) {
                    text = mathSymbols.charAt(Math.floor(Math.random() * mathSymbols.length));
                    color = '#007bff';
                } else {
                    text = techSymbols.charAt(Math.floor(Math.random() * techSymbols.length));
                    color = '#7d3f98';
                }
                
                ctx.fillStyle = color;
                ctx.fillText(text, i * fontSize, y * fontSize);
                
                if (y * fontSize > canvas.height && Math.random() > 0.95) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 100);

        setInterval(() => {
            const el = document.getElementById('year-change');
            el.innerText = (el.innerText === '26') ? '27' : '26';
        }, 3000);
    </script>
</body>
</html>
